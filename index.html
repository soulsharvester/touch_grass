<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c15" />
    <meta name="description" content="A tiny 3D game about getting outside and touching grass." />
    <title>Touch Grass</title>
  </head>
  <body>
    <main id="app">
      <div id="game-canvas" aria-hidden="true"></div>
      <section id="menu-screen" class="screen menu-screen">
        <div class="menu-card">
          <div class="eyebrow"><span class="sun-mark"></span> A LITTLE FRESH AIR</div>
          <h1>Touch<br /><span>Grass.</span></h1>
          <button id="new-game" class="button button-primary">Step outside <span>↗</span></button>
        </div>
        <div class="menu-stamp">FIELD<br />NO. 001</div>
      </section>

      <section id="loading-screen" class="screen loading-screen is-hidden">
        <div class="loading-mark">✳</div>
        <p>GROWING YOUR PATCH</p>
        <div class="loading-line"><span></span></div>
      </section>

      <section id="game-ui" class="is-hidden">
        <header class="topbar">
          <a class="wordmark" href="#" aria-label="Touch Grass"><span class="wordmark-icon">✳</span> touch grass</a>
          <div class="stats">
            <div class="stat"><span class="stat-label">YOUR HARVEST</span><span id="blade-count" class="stat-value">0 <span class="blade-icon">✳</span></span></div>
            <div class="stat stat-time"><span class="stat-label">TIME OUTSIDE</span><span id="time-played" class="stat-value">00:00</span></div>
          </div>
          <div class="top-actions">
            <button id="perspective-toggle" class="view-button" aria-label="Switch to first-person view">1ST <kbd>P</kbd></button>
            <button id="shop-open" class="button button-shop"><span>＋</span> Field shop</button>
            <button id="pause-game" class="icon-button" aria-label="Pause game">Ⅱ</button>
          </div>
        </header>

        <div class="world-label"><span class="live-dot"></span> THE OPEN FIELD <span id="vehicle-badge" class="vehicle-badge is-hidden">ROAD TRIP</span></div>
        <div id="first-person-hud" class="first-person-hud is-hidden" aria-hidden="true">
          <div class="crosshair"><span></span><i></i></div>
        </div>
        <div id="toast" class="toast" role="status"></div>
        <div class="game-bottom">
          <button id="fire-tool" class="button button-fire is-hidden">Fire grass popper <kbd>F</kbd></button>
        </div>
        <div id="mobile-controls" class="mobile-controls" aria-label="Movement controls">
          <div class="d-pad">
            <button data-key="KeyW" aria-label="Move forward">▲</button>
            <div><button data-key="KeyA" aria-label="Move left">◀</button><button data-key="KeyS" aria-label="Move backward">▼</button><button data-key="KeyD" aria-label="Move right">▶</button></div>
          </div>
          <div class="mobile-actions"><button data-key="Space" class="mobile-jump">JUMP</button><button data-key="KeyE">DRIVE</button><button id="mobile-fire" class="is-hidden">FIRE</button></div>
        </div>
      </section>

      <section id="shop-panel" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="shop-title">
        <div class="shop-card">
          <div class="modal-heading"><div><div class="eyebrow">TOOLS FOR THE TRAIL</div><h2 id="shop-title">Field shop<span>.</span></h2></div><button class="icon-button modal-close" data-close="shop" aria-label="Close shop">×</button></div>
          <div id="shop-items" class="shop-items"></div>
        </div>
      </section>

      <section id="pause-screen" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <div class="pause-card">
          <div class="pause-mark">Ⅱ</div><div class="eyebrow">TAKE YOUR TIME</div><h2 id="pause-title">Taking a breather<span>.</span></h2>
          <button id="resume-game" class="button button-primary">Back to the field</button>
          <button id="quit-game" class="text-button">Head back to the start</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
